org.gradle.jvmargs=-Xmx12g -XX:MaxMetaspaceSize=4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP is in the 8.6-9.0 range, where the optimized resource shrinker is
# available but not yet the default.
android.r8.optimizedResourceShrinking=true
kotlin.code.style=official
# Mirrors ubo-kotlin-grpc/gradle.properties — the included :protos module's
# generated Ubo.java is ~20 MB, so the Kotlin compiler daemon needs the
# same heap headroom as Gradle.
kotlin.daemon.jvmargs=-Xmx12g -XX:MaxMetaspaceSize=4g
kotlin.compiler.execution.strategy=in-process
